  const g = wctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, TOK.c1); g.addColorStop(1, TOK.c2);
  for (let i=0;i<n;i++){
    const a = Math.floor(i/n*pk.length), b = Math.max(a+1, Math.floor((i+1)/n*pk.length));
    let m = 0; for (let j=a;j<b;j++) if (pk[j] > m) m = pk[j];
    const h = Math.max(2*d, Math.pow(m, 0.85)*H*0.92), x = i*(bw+gap), played = i/n < frac;
    wctx.fillStyle = played ? g : TOK.rest;
    wctx.beginPath(); wctx.roundRect ? wctx.roundRect(x, (H-h)/2, bw, h, bw/2) : wctx.rect(x, (H-h)/2, bw, h); wctx.fill();
  }
  const px = frac*W;
  wctx.fillStyle = "#fff"; wctx.fillRect(px - d, 0, 2*d, H);
}

/* spectrum */
let spec = null, sctx = null, fbuf = null, smooth = null;
function setupSpec(){
  spec = $("#spec"); sctx = spec.getContext("2d");
  const fit = () => { const d = devicePixelRatio || 1; spec.width = Math.round(spec.clientWidth*d); spec.height = Math.round(spec.clientHeight*d); drawSpec(); };
  fit(); new ResizeObserver(fit).observe(spec);
}
let beat = 0;
function drawSpec(){
  if (!sctx || !spec.isConnected) return;
  const W = spec.width, H = spec.height, d = devicePixelRatio || 1, bars = Math.max(24, Math.min(72, Math.floor(W/(9*d))));
  sctx.clearRect(0, 0, W, H);
  if (!smooth || smooth.length !== bars) smooth = new Float32Array(bars);
  let bass = 0;
  if (analyser && playing){
    if (!fbuf) fbuf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(fbuf);
    const ny = ac.sampleRate/2, nb = fbuf.length;
    for (let i=0;i<bars;i++){
      const f0 = 30*Math.pow(16000/30, i/bars), f1 = 30*Math.pow(16000/30, (i+1)/bars);
      const b0 = Math.floor(f0/ny*nb), b1 = Math.max(b0+1, Math.floor(f1/ny*nb));
      let m = 0; for (let j=b0;j<b1;j++) m = Math.max(m, fbuf[j]);
      const v = Math.pow(m/255, 1.6);
      smooth[i] += (v - smooth[i])*(v > smooth[i] ? 0.6 : 0.18);
    }
    for (let j=1;j<Math.floor(140/ny*nb);j++) bass = Math.max(bass, fbuf[j]/255);
  } else for (let i=0;i<bars;i++) smooth[i] *= 0.9;
  beat += (Math.pow(bass, 3) - beat)*0.25;
  document.documentElement.style.setProperty("--beat", beat.toFixed(3));
  const gw = W/bars, bw = Math.max(2*d, gw*0.55);
  const g = sctx.createLinearGradient(0, H, 0, 0); g.addColorStop(0, TOK.c1); g.addColorStop(1, TOK.c2);
  sctx.fillStyle = g;
  for (let i=0;i<bars;i++){
    const h = Math.max(3*d, smooth[i]*H*0.95), x = i*gw + (gw-bw)/2;
    sctx.globalAlpha = 0.35 + smooth[i]*0.65;
    sctx.beginPath(); sctx.roundRect ? sctx.roundRect(x, H-h, bw, h, bw/2) : sctx.rect(x, H-h, bw, h); sctx.fill();
  }
  sctx.globalAlpha = 1;
}

/* animation loop: waveform, spectrum, vinyl */
let raf = 0, angle = 0, lastT = 0;
function startLoop(){
  if (raf) return;
  lastT = performance.now();
  const f = now => {
    const dt = (now - lastT)/1000; lastT = now;
    if (playing && cur){ const es = effS(cur).speed; angle = (angle + dt*es*200) % 360; const v = $("#vinyl"); if (v) v.style.transform = `rotate(${angle}deg)`;
      if (prefs.player === "cassette") updateCassette(curPos()/cur.buffer.duration, dt, es);
      // autoplay: fade out the last moments before moving to the next song
      if (!xfOut && xf && nextIndex(cur) >= 0 && tracks[nextIndex(cur)] !== cur
          && (cur.buffer.duration - curPos())/es < 1.7){ xfOut = true; xf.gain.cancelScheduledValues(ac.currentTime); xf.gain.setTargetAtTime(0, ac.currentTime, 0.45); } }
    drawWave(); drawSpec(); renderTimes();
    if (playing || beat > 0.002 || (smooth && smooth.some(x => x > 0.01))) raf = requestAnimationFrame(f); else raf = 0;
  };
  raf = requestAnimationFrame(f);
}

/* ================= Moon design: textured moon, volumetric light rays, lit dust ================= */
const isMoon = () => document.documentElement.getAttribute("data-skin") === "moon";
// small deterministic random so the moon looks the same every visit
const rng = (seed => () => (seed = (seed*16807) % 2147483647) / 2147483647)(20261118);

// ---- moon texture, painted once ----
const MOON_TEX = (() => {
  const D = 720, R = D/2, c = document.createElement("canvas"); c.width = c.height = D;
  const g = c.getContext("2d");
  g.save(); g.beginPath(); g.arc(R, R, R, 0, Math.PI*2); g.clip();
  // sphere shading, lit from the lower left (towards the page)
  let gr = g.createRadialGradient(R*0.72, R*1.28, R*0.05, R, R, R*1.05);
  gr.addColorStop(0, "#fbfaf6"); gr.addColorStop(0.55, "#e6e4dd"); gr.addColorStop(0.85, "#c9c7bf"); gr.addColorStop(1, "#a9a7a0");
  g.fillStyle = gr; g.fillRect(0, 0, D, D);
  // maria: soft dark seas
  g.filter = "blur(14px)";
  const seas = [[0.62,0.30,0.20],[0.45,0.42,0.16],[0.70,0.55,0.15],[0.38,0.66,0.12],[0.55,0.75,0.10],[0.28,0.35,0.09],[0.80,0.38,0.11]];
  for (const [sx, sy, sr] of seas){
    for (let k=0;k<5;k++){
      const x = (sx + (rng()-.5)*sr*0.9)*D, y = (sy + (rng()-.5)*sr*0.9)*D, r = sr*D*(0.45 + rng()*0.5);
      const m = g.createRadialGradient(x, y, 0, x, y, r);
      m.addColorStop(0, "rgba(80,80,78,.42)"); m.addColorStop(0.7, "rgba(92,92,90,.2)"); m.addColorStop(1, "rgba(96,96,94,0)");
      g.fillStyle = m; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    }
  }
  g.filter = "none";
  // craters with light from the lower left: dark inner edge lower-left, bright rim upper-right
  const crater = (x, y, r, depth) => {
    const lg = g.createLinearGradient(x - r, y + r, x + r, y - r);
    lg.addColorStop(0, `rgba(40,40,38,${0.22*depth})`); lg.addColorStop(0.6, `rgba(70,70,68,${0.06*depth})`); lg.addColorStop(1, `rgba(255,255,255,${0.05*depth})`);
    g.fillStyle = lg; g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
    g.lineWidth = Math.max(0.8, r*0.09);
    g.strokeStyle = `rgba(255,255,250,${0.22*depth})`; g.beginPath(); g.arc(x, y, r*0.98, Math.PI*0.25, Math.PI*1.25, true); g.stroke();
    g.strokeStyle = `rgba(30,30,28,${0.16*depth})`; g.beginPath(); g.arc(x, y, r*0.98, Math.PI*0.25, Math.PI*1.25); g.stroke();
  };
  // one bright young crater with ray streaks
  const tx = D*0.38, ty = D*0.80;
  g.globalCompositeOperation = "lighter";
  for (let k=0;k<26;k++){ const a = rng()*Math.PI*2, L = D*(0.12 + rng()*0.3);
    const sg = g.createLinearGradient(tx, ty, tx + Math.cos(a)*L, ty + Math.sin(a)*L);
    sg.addColorStop(0, "rgba(255,255,255,.055)"); sg.addColorStop(1, "rgba(255,255,255,0)");
    g.strokeStyle = sg; g.lineWidth = 2 + rng()*5; g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + Math.cos(a)*L, ty + Math.sin(a)*L); g.stroke(); }
  g.globalCompositeOperation = "source-over";
  crater(tx, ty, D*0.022, 1.3);
  const big = [[0.30,0.25,0.07],[0.72,0.18,0.05],[0.83,0.62,0.06],[0.20,0.55,0.045],[0.56,0.52,0.04],[0.64,0.86,0.05],[0.47,0.17,0.035],[0.15,0.75,0.03]];
  for (const [bx, by, br] of big) crater(bx*D, by*D, br*D, 1);
  for (let k=0;k<70;k++){ const r = D*(0.003 + Math.pow(rng(), 3)*0.022); crater(rng()*D, rng()*D, r, 0.4 + rng()*0.5); }
  // fine grain
  const img = g.getImageData(0, 0, D, D), px = img.data;
  for (let i=0;i<px.length;i+=4){ const n = (rng()-0.5)*14; px[i] += n; px[i+1] += n; px[i+2] += n; }
  g.putImageData(img, 0, 0);
  // limb darkening + soft terminator on the upper right
  gr = g.createRadialGradient(R, R, R*0.55, R, R, R);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.38)");
  g.fillStyle = gr; g.fillRect(0, 0, D, D);
  gr = g.createRadialGradient(R*1.55, R*0.45, R*0.2, R*1.4, R*0.6, R*1.25);
  gr.addColorStop(0, "rgba(0,0,0,.42)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, D, D);
  g.restore();
  c.id = "moonEl"; c.setAttribute("aria-hidden", "true");
  document.getElementById("aurora").after(c);
  return c;
})();

// ---- one soft light-shaft sprite, drawn rotated/stretched for every ray ----
const RAY = (() => {
  const w = 512, h = 128, c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), img = g.createImageData(w, h), d = img.data;
  for (let x=0;x<w;x++){
    const u = x/w, along = Math.min(1, u/0.04)*Math.pow(1-u, 1.35);
    const half = 1.5 + u*58;                       // the shaft widens away from the moon
    for (let y=0;y<h;y++){
      const dy = (y - h/2)/half, v = Math.exp(-dy*dy*1.6)*along, o = (y*w + x)*4;
      d[o] = d[o+1] = d[o+2] = 255; d[o+3] = Math.round(v*255);
    }
  }
  g.putImageData(img, 0, 0);
  return c;
})();

const RAYS = Array.from({length:17}, (_, i) => {
  const major = i % 4 === 0;
  return {base:(100 + rng()*95)*Math.PI/180, w:major ? 0.05 + rng()*0.05 : 0.012 + rng()*0.035,
          a:major ? 0.16 + rng()*0.08 : 0.05 + rng()*0.09, sp:0.08 + rng()*0.22, ph:rng()*6.28, sw:0.02 + rng()*0.05};
});
const MOTES = Array.from({length:150}, () => ({x:rng(), y:rng(), z:0.3 + rng()*0.7, vx:(rng()-.5)*0.004, vy:(rng()-.5)*0.004 - 0.002, ph:rng()*6.28}));
let rayState = null;   // CSS-pixel geometry, used to light up buttons

function moonGeom(W, H){ const R = Math.max(110, Math.min(W, H)*0.2); return {R, cx:W - R*0.28, cy:R*0.12}; }
function rayAt(r, t, b){
  const ang = r.base + Math.sin(t*0.28 + r.ph)*r.sw*2.4 + Math.sin(t*0.13 + r.ph*0.5)*0.035 + Math.sin(t*0.09)*0.11;
  const fl = 0.5 + 0.5*Math.sin(t*(0.35 + r.sp*2.5) + r.ph);
  return {ang, w:r.w*(0.85 + 0.3*fl), a:r.a*(0.25 + 0.75*fl*fl) + b*0.12};
}
function moonScene(x, t, dt, W, H, b, S){
  const cw = W/S, chh = H/S, m = moonGeom(cw, chh);
  // the moon floats and sways a little
  const fx = Math.cos(t*0.37)*m.R*0.05, fy = Math.sin(t*0.5)*m.R*0.07, rotDeg = Math.sin(t*0.21)*5;
  m.cx += fx; m.cy += fy;
  const cx = m.cx*S, cy = m.cy*S, R = m.R*S;
  const L = Math.hypot(W, H)*1.15;
  const rays = RAYS.map(r => rayAt(r, t, b));
  rayState = {cx:m.cx, cy:m.cy, R:m.R, L:L/S, rays};
  x.globalCompositeOperation = "lighter";
  // wide bloom behind everything
  let g = x.createRadialGradient(cx, cy, R*0.6, cx, cy, R*5.5);
  g.addColorStop(0, `rgba(235,235,230,${0.16 + b*0.12})`); g.addColorStop(0.35, `rgba(200,200,195,${0.05 + b*0.05})`); g.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // light shafts
  for (const r of rays){
    if (r.a < 0.004) continue;
    x.save(); x.translate(cx, cy); x.rotate(r.ang);
    x.globalAlpha = Math.min(1, r.a);
    x.scale(L/RAY.width, (L*Math.tan(r.w))/58);
    x.drawImage(RAY, 0, -RAY.height/2);
    x.restore();
  }
  x.globalAlpha = 1;
  // dust motes: almost invisible, flare up inside a shaft
  for (const p of MOTES){
    p.x += p.vx*dt*(1 + b*3); p.y += p.vy*dt*(1 + b*3);
    if (p.x < 0) p.x += 1; if (p.x > 1) p.x -= 1; if (p.y < 0) p.y += 1; if (p.y > 1) p.y -= 1;
    const px = p.x*W, py = p.y*H, ang = Math.atan2(py - cy, px - cx), dist = Math.hypot(px - cx, py - cy);
    let lit = 0;
    for (const r of rays){ const d = (ang - r.ang)/Math.max(0.006, r.w*0.7); lit += Math.exp(-d*d)*r.a*5; }
    const fall = Math.max(0, 1 - dist/L);
    const al = Math.min(1, 0.04 + lit*fall*(0.6 + 0.4*Math.sin(t*1.7 + p.ph)));
    if (al < 0.05) continue;
    const rr = p.z*(1.1 + lit*1.8)*S;
    x.fillStyle = `rgba(255,255,255,${al})`; x.beginPath(); x.arc(px, py, rr, 0, Math.PI*2); x.fill();
  }
  // tight corona
  g = x.createRadialGradient(cx, cy, R*0.95, cx, cy, R*1.7);
  g.addColorStop(0, `rgba(255,255,250,${0.32 + Math.sin(t*0.8)*0.08 + b*0.25})`); g.addColorStop(1, "rgba(255,255,250,0)");
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, R*1.7, 0, Math.PI*2); x.fill();
  x.globalCompositeOperation = "source-over";
  // the moon itself is a separate crisp element; just place it
  const st = MOON_TEX.style, bx = m.cx - fx, by = m.cy - fy, key = `${bx|0},${by|0},${m.R|0}`;
  if (MOON_TEX._k !== key){ MOON_TEX._k = key; st.left = (bx - m.R) + "px"; st.top = (by - m.R) + "px"; st.width = st.height = (m.R*2) + "px"; }
  st.transform = `translate(${fx.toFixed(2)}px,${fy.toFixed(2)}px) rotate(${rotDeg.toFixed(2)}deg) scale(${(1 + b*0.02 + Math.sin(t*0.8)*0.006).toFixed(4)})`;
}

// buttons light up while a shaft crosses them
const LIT_SEL = ".sbox,.fmt,.crow,.btn,.preset,.icon-btn,.play,.chip,.tabs button,.track,.ctl,.plus-add,.skin-btn,.pill,.val,.kebab,.export select";
setInterval(() => {
  const els = document.querySelectorAll(LIT_SEL);
  if (!isMoon() || !rayState){ els.forEach(e => { if (e.style.getPropertyValue("--lit")) e.style.removeProperty("--lit"); }); return; }
  const {cx, cy, L, rays} = rayState;
  els.forEach(el => {
    const r = el.getBoundingClientRect(); if (!r.width) return;
    const ex = r.left + r.width/2, ey = r.top + r.height/2, dist = Math.hypot(ex - cx, ey - cy), ang = Math.atan2(ey - cy, ex - cx);
    const extra = Math.min(r.width, r.height)/2/Math.max(40, dist);
    let lit = 0;
    for (const ry of rays){ const d = (ang - ry.ang)/(ry.w + extra); lit += Math.exp(-d*d)*ry.a*5.5; }
    el.style.setProperty("--lit", Math.min(1, lit*Math.max(0.25, 1 - dist/L)).toFixed(2));
  });
}, 90);

/* ================= aurora background (breathes with the bass) ================= */
(() => {
  const c = $("#aurora"), x = c.getContext("2d");
  const blobs = [
    {h:"255,111,159", r:.55, sx:.07, sy:.05, px:.15, py:.2},
    {h:"157,123,255", r:.6,  sx:.05, sy:.08, px:.85, py:.15},
    {h:"255,176,103", r:.45, sx:.09, sy:.06, px:.75, py:.9},
    {h:"94,224,184",  r:.35, sx:.06, sy:.09, px:.2,  py:.95},
  ];
  const reduce = false; // the owner wants the motion on, even with Windows animations turned off
  let S = isMoon() ? 0.5 : 0.6;
  const fit = () => { c.width = Math.round(innerWidth*S); c.height = Math.round(innerHeight*S); };
  fit(); addEventListener("resize", fit);
  const stars = Array.from({length:150}, () => ({x:Math.random(), y:Math.random(), z:Math.random()*0.9 + 0.1, tw:Math.random()*6.28, sp:0.5 + Math.random()*2}));
  const dust = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), v:0.01 + Math.random()*0.03, r:0.6 + Math.random()*1.8, hue:Math.random() < .5 ? "255,160,190" : "255,200,150"}));
  let t0 = performance.now(), last = t0, shoot = null;
  const draw = now => {
    const t = (now - t0)/1000, dt = Math.min(0.05, (now - last)/1000); last = now;
    const wantS = isMoon() ? 0.5 : 0.6; if (wantS !== S){ S = wantS; fit(); }
    const W = c.width, H = c.height, b = +getComputedStyle(document.documentElement).getPropertyValue("--beat") || 0;
    const moon = isMoon();
    x.globalCompositeOperation = "source-over";
    x.fillStyle = moon ? "#000" : "#0c0915"; x.fillRect(0, 0, W, H);
    // twinkling stars, gently drifting
    for (const s of stars){
      s.y -= dt*0.004*s.z*(1 + b*6); if (s.y < 0){ s.y = 1; s.x = Math.random(); }
      const a = (0.25 + 0.75*Math.abs(Math.sin(t*s.sp + s.tw)))*s.z*0.85;
      x.fillStyle = `rgba(255,240,250,${a})`;
      const r = s.z*1.3*S;
      x.fillRect(s.x*W, s.y*H, r, r);
    }
    // shooting star now and then
    if (!shoot && Math.random() < dt*0.12) shoot = {x:Math.random()*W*0.7 + W*0.2, y:Math.random()*H*0.35, life:0};
    if (shoot){
      shoot.life += dt; const p = shoot.life/0.9, len = 120*S;
      const sx = shoot.x - p*260*S, sy = shoot.y + p*130*S;
      const g = x.createLinearGradient(sx, sy, sx + len, sy - len/2);
      g.addColorStop(0, `rgba(255,255,255,${0.9*(1-p)})`); g.addColorStop(1, "rgba(255,255,255,0)");
      x.strokeStyle = g; x.lineWidth = 1.6*S; x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + len, sy - len/2); x.stroke();
      if (p >= 1) shoot = null;
    }
    if (moon){ moonScene(x, t, dt, W, H, b, S); if (!reduce) requestAnimationFrame(draw); return; }
    // aurora blobs, swelling on the kick
    x.globalCompositeOperation = "lighter";
    blobs.forEach((o, i) => {
      const cx = (o.px + Math.sin(t*o.sx + i)*0.16)*W, cy = (o.py + Math.cos(t*o.sy + i*2)*0.13)*H;
      const rad = o.r*Math.max(W, H)*(1 + b*0.35);
      const g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, `rgba(${o.h},${0.3 + b*0.3})`); g.addColorStop(0.5, `rgba(${o.h},${0.09 + b*0.08})`); g.addColorStop(1, `rgba(${o.h},0)`);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
    });
    // glowing dust rising like bubbles in the reverb
    for (const d of dust){
      d.y -= dt*d.v*(1 + b*5); d.x += Math.sin(t*0.6 + d.r*3)*dt*0.004;
      if (d.y < -0.02){ d.y = 1.02; d.x = Math.random(); }
      const r = d.r*S*(1 + b*1.2)*3;
      const g = x.createRadialGradient(d.x*W, d.y*H, 0, d.x*W, d.y*H, r);
      g.addColorStop(0, `rgba(${d.hue},${0.5 + b*0.4})`); g.addColorStop(1, `rgba(${d.hue},0)`);
      x.fillStyle = g; x.fillRect(d.x*W - r, d.y*H - r, r*2, r*2);
    }
    if (!reduce) requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
})();

/* ================= menus & toast ================= */
let menuEl = null;
function openMenu(anchor, items){
  closeMenu();
  const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu");
  items.forEach(it => {
    if (it === "-"){ const s = document.createElement("div"); s.className = "sep"; m.appendChild(s); return; }
    const b = document.createElement("button"); b.textContent = it[0]; b.setAttribute("role", "menuitem"); if (it[2]) b.className = it[2];
    b.onclick = e => { e.stopPropagation(); closeMenu(); it[1](); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = clamp(r.right - mw, 8, innerWidth - mw - 8) + "px";
  m.style.top = (r.bottom + mh + 8 > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + "px";
  menuEl = m;
}
function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } }
document.addEventListener("click", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
let toastEl = null, toastTimer = 0;
function toast(html, ms){
  if (!toastEl){ toastEl = document.createElement("div"); toastEl.className = "toast"; toastEl.setAttribute("role", "status"); document.body.appendChild(toastEl); }
  toastEl.innerHTML = html; toastEl.hidden = false;
  clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(hideToast, ms);

let dbP = null;
function idb(){
  return dbP || (dbP = new Promise((res, rej) => {
    const r = indexedDB.open("slowwave", 3);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains("lib")) d.createObjectStore("lib", {keyPath:"id", autoIncrement:true});
      if (!d.objectStoreNames.contains("queue")) d.createObjectStore("queue", {keyPath:"id"});
      if (!d.objectStoreNames.contains("files")) d.createObjectStore("files", {keyPath:"id"});
      if (!d.objectStoreNames.contains("hist")) d.createObjectStore("hist", {keyPath:"id"}); };
    r.onsuccess = () => res(r.result); r.onerror = () => { dbP = null; rej(r.error); };
  }));
}

  let recs = [];

  if (!recs.length) return;
  restoring = true;
  recs.sort((a, b) => a.order - b.order);
  let state = {}; try { state = JSON.parse(localStorage.getItem("sw2-state") || "{}"); } catch {}
  await ensureCtx();
  for (let i=0;i<recs.length;i++){

      const f = await dbOp("files", "readonly", st => st.get(r.id)); if (!f || !f.file) continue;
      const buffer = await ac.decodeAudioData((await f.file.arrayBuffer()).slice(0));

}

const sState = {sc:null, yt:[], q:"", results:[], sel:-1, open:-1, token:0, audio:null, playing:-1, loading:false, err:""};
function previewStop(){ if (sState.audio){ sState.audio.pause(); sState.audio = null; } sState.playing = -1; }
function previewToggle(i){
  const r = sState.results[i]; if (!r || !r.preview) return;
  if (sState.playing === i){ previewStop(); renderSearch(); return; }
  previewStop();
  if (playing) pause();
  const a = new Audio(r.preview); a.volume = Math.min(1, siteVolGain() || 0.8);
  a.onended = () => { sState.playing = -1; renderSearch(); };
  a.ontimeupdate = () => { const h = document.querySelector(`[data-head="${i}"]`); if (h) h.parentElement.style.setProperty("--pp", Math.min(1, a.currentTime/(a.duration || 30)).toFixed(3)); };
  a.play().catch(() => toast("This preview could not play. Try another song.", 2500));
  sState.audio = a; sState.playing = i; renderSearch();
}
function renderSearch(){
  const box = $("#sres"), inp = $("#q"); if (!box) return;
  const q = inp.value.trim();
  if (!q){
    if (document.activeElement === inp && hist.length){
      box.hidden = false;
      box.innerHTML = `<div class="syth" style="padding:10px 10px 6px">Recently opened</div><div class="hist compact">${hist.slice(0, 6).map(e => histRow(e, true)).join("")}</div><div class="sfoot">Type to search Apple Music, Deezer and YouTube · All history is in Library</div>`;
      box.querySelectorAll("[data-hist]").forEach(r => r.onclick = ev => { ev.stopPropagation(); histOpen(+r.dataset.hist); });
    } else box.hidden = true;
    return;
  }
  box.hidden = false;
  if (sState.sc){
    const sc = sState.sc;
    box.innerHTML = sc.loading ? `<div class="snote"><span class="spin"></span>Opening SoundCloud link…</div>`
      : sc.err ? `<div class="snote">This SoundCloud link could not be opened. Copy the track link again from SoundCloud (Share → Copy link).</div>`
      : `<div class="sccard"><img src="${esc(sc.info.thumbnail_url || "")}" alt=""><div class="smain"><div class="st">${esc(sc.info.title || "SoundCloud track")}</div><div class="sa">${esc(sc.info.author_name || "")} · SoundCloud</div>
          <div class="scbtns"><button class="slink s-studio" id="scGo">▶ Play here</button><a class="slink s-soundcloud" href="${esc(sc.url)}" target="_blank" rel="noopener">Open on SoundCloud</a></div></div></div>
        <div class="sfoot">Plays in the official SoundCloud player at the bottom of the page. Speed and effects only work on files and previews.</div>`;
    const go = $("#scGo"); if (go) go.onclick = e => { e.stopPropagation(); scPlay(); };
    return;
  }
  const ytBlock = sState.yt.length ? `<div class="syt"><div class="syth"><svg width="18" height="13" viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#ff1f1f"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>Search on YouTube</div>
    <div class="sytl">${sState.yt.map(t => { const i = t.toLowerCase().indexOf(q.toLowerCase());
      const label = i >= 0 ? esc(t.slice(0, i)) + "<b>" + esc(t.slice(i, i + q.length)) + "</b>" + esc(t.slice(i + q.length)) : esc(t);
      return `<a class="sytq" href="https://www.youtube.com/results?search_query=${encodeURIComponent(t)}" target="_blank" rel="noopener"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>${label}</span><svg class="sgo" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`; }).join("")}</div></div>` : "";
  if (sState.loading && !sState.results.length){ box.innerHTML = `<div class="snote"><span class="spin"></span>Searching Apple Music and Deezer…</div>` + ytBlock; return; }
  if (sState.err && !sState.results.length){ box.innerHTML = `<div class="snote">${esc(sState.err)}</div>` + ytBlock; return; }
  if (!sState.results.length){ box.innerHTML = `<div class="snote">No songs found for “${esc(q)}” on Apple Music or Deezer.${ytBlock ? " Try YouTube below." : " Check the spelling or try the artist name."}</div>` + ytBlock; return; }
  box.innerHTML = sState.results.map((r, i) => `
    <div class="sitem${i === sState.sel ? " sel" : ""}${i === sState.open ? " open" : ""}" data-i="${i}" role="option" aria-selected="${i === sState.sel}">
      <div class="srow">
        <button class="sart" data-play="${i}" aria-label="${sState.playing === i ? "Stop preview" : "Play 30-second preview"}" ${r.preview ? "" : "disabled"}>

          <div class="st">${esc(r.title)}${r.explicit ? ' <span class="sexp">E</span>' : ""}</div>

          ${r.preview && r.dur ? `<div class="spv" title="The preview is 30 seconds of the ${mmss(r.dur)} song"><div class="spvbar" style="--w:${Math.min(100, 30/r.dur*100).toFixed(1)}%"><i></i><b data-head="${i}"></b></div><span>0:30 / ${mmss(r.dur)}</span></div>` : ""}
        </div>
        <div class="sside"><span class="sdur">${mmss(r.dur)}</span><span class="ssrc">${r.src.join(" + ")}</span></div>

      </div>
      ${i === sState.open ? `<div class="slinks">${r.preview ? `<button class="slink s-studio" data-studio="${i}">Remix in Studio · 30 s preview</button>` : ""}${SERVICES.map(s => `<a href="${esc(s.url(r))}" target="_blank" rel="noopener" class="slink s-${s.id}">${s.name}</a>`).join("")}</div>` : ""}
    </div>`).join("") + ytBlock + `<div class="sfoot">Songs from Apple Music and Deezer · ▶ plays an official 30-second preview · Paste a SoundCloud link to play it here</div>`;
}
async function loadPreviewToStudio(i){
  const r = sState.results[i]; if (!r || !r.preview){ toast("This song has no preview to load.", 2500); return; }
  $("#sres").hidden = true; previewStop(); $("#q").blur();
  show("studio");
  toast('<span class="spin"></span>Loading ' + esc(r.artist + " - " + r.title), 0);
  try {
    const res = await fetch(r.preview); if (!res.ok) throw new Error();
    const blob = await res.blob();
    const ext = /\.m4a|aac/i.test(r.preview) ? "m4a" : "mp3";
    const name = (r.artist + " - " + r.title).replace(/[\/:*?"<>|]+/g, " ") + " (preview)." + ext;
    await addFiles([new File([blob], name, {type:ext === "m4a" ? "audio/mp4" : "audio/mpeg"})], undefined, {preview:true, fullDur:r.dur || 0, art:r.art || "", artist:r.artist, title:r.title});
  } catch { toast("Could not load this preview. Try another song.", 3000); }
}
const SC_RE = /^(https?:\/\/)?(www\.|m\.|on\.)?soundcloud\.(com|app\.goo\.gl)\/\S+/i;
async function scLookup(url){
  const tok = ++sState.token; sState.sc = {url, loading:true}; renderSearch();
  try {
    const full = /^https?:/i.test(url) ? url : "https://" + url;
    const r = await fetch("https://soundcloud.com/oembed?format=json&url=" + encodeURIComponent(full));
    if (!r.ok) throw new Error();
    const d = await r.json(); if (tok !== sState.token) return;
    const m = /src="([^"]+)"/.exec(d.html || ""); if (!m) throw new Error();
    sState.sc = {url:full, info:d, widget:m[1].replace(/&amp;/g, "&")};
  } catch { if (tok !== sState.token) return; sState.sc = {url, err:true}; }
  renderSearch();
}
function scPlay(){
  const sc = sState.sc; if (!sc || !sc.widget) return;
  if (playing) pause(); previewStop();
  let u = sc.widget.replace(/auto_play=false/, "auto_play=true").replace(/visual=true/, "visual=false").replace(/show_artwork=false/, "show_artwork=true");
  if (!/auto_play=/.test(u)) u += "&auto_play=true";
  u += "&color=%23111111&show_teaser=false&hide_related=true";
  $("#scframe").src = u; $("#scTitle").textContent = sc.info.title || "";
  $("#scdock").hidden = false; $("#sres").hidden = true;
}
$("#scClose").onclick = () => { $("#scdock").hidden = true; $("#scframe").src = "about:blank"; };
let sT = 0;
function runSearch(q){
  const tok = ++sState.token;
  sState.loading = true; sState.err = ""; renderSearch();
  searchYT(q).then(list => { if (tok !== sState.token) return; sState.yt = list; renderSearch(); }).catch(() => {});
  Promise.allSettled([searchApple(q), searchDeezer(q)]).then(([a, d]) => {
    if (tok !== sState.token) return;
    const A = a.status === "fulfilled" ? a.value : [], D = d.status === "fulfilled" ? d.value : [];
    sState.loading = false;
    if (a.status === "rejected" && d.status === "rejected") sState.err = "Search is not reachable right now. Check your connection and try again.";
    previewStop();
    sState.results = mergeResults(A, D); sState.sel = sState.results.length ? 0 : -1; sState.open = -1;
    renderSearch();
  });
}
(() => {
  const inp = $("#q"), box = $("#sres"), wrap = $("#search");
  inp.addEventListener("input", () => {
    clearTimeout(sT); const q = inp.value.trim();
    if (!q){ sState.results = []; sState.yt = []; sState.sc = null; previewStop(); renderSearch(); return; }
    if (SC_RE.test(q)){ sState.results = []; sState.yt = []; scLookup(q); return; }
    sState.sc = null;
    sT = setTimeout(() => runSearch(q), 230);
  });
  inp.addEventListener("focus", () => renderSearch());
  inp.addEventListener("keydown", e => {
    const n = sState.results.length;
    if (e.key === "ArrowDown" && n){ e.preventDefault(); sState.sel = (sState.sel + 1) % n; renderSearch(); }
    else if (e.key === "ArrowUp" && n){ e.preventDefault(); sState.sel = (sState.sel - 1 + n) % n; renderSearch(); }
    else if (e.key === "Enter" && sState.sel >= 0){ e.preventDefault(); sState.open = sState.open === sState.sel ? -1 : sState.sel; renderSearch(); }
    else if (e.key === " " && e.ctrlKey && sState.sel >= 0){ e.preventDefault(); previewToggle(sState.sel); }
    else if (e.key === "Escape"){ box.hidden = true; previewStop(); inp.blur(); }
    const el = box.querySelector(".sitem.sel"); if (el) el.scrollIntoView({block:"nearest"});
  });
  box.addEventListener("click", e => {
    const st = e.target.closest("[data-studio]"); if (st){ e.stopPropagation(); loadPreviewToStudio(+st.dataset.studio); return; }
    const p = e.target.closest("[data-play]"); if (p){ e.stopPropagation(); previewToggle(+p.dataset.play); return; }
    if (e.target.closest("a")) return;
    const it = e.target.closest(".sitem"); if (!it) return;
    e.stopPropagation();   // the list re-renders, so the outside-click check would see a detached node
    const i = +it.dataset.i; sState.sel = i; sState.open = sState.open === i ? -1 : i; renderSearch();
  });
  document.addEventListener("click", e => { if (!wrap.contains(e.target)){ box.hidden = true; } });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); inp.focus(); inp.select(); }
  });
})();

/* ================= history (recently opened songs and previews) ================= */
const HIST_MAX = 20;
let hist = (() => { try { return JSON.parse(localStorage.getItem("sw2-hist") || "[]"); } catch { return []; } })();
const histSave = () => { try { localStorage.setItem("sw2-hist", JSON.stringify(hist)); } catch {} };
function histAdd(t){
  let e = t.histId ? hist.find(x => x.id === t.histId) : null;
  if (!e) e = hist.find(x => x.name === t.name && x.size === (t.file && t.file.size));
  if (e){ hist = [e, ...hist.filter(x => x !== e)]; e.at = Date.now(); t.histId = e.id; histSave(); return; }
  e = {id:Date.now() + Math.floor(Math.random()*1000), name:t.name, size:t.file ? t.file.size : 0, kind:t.preview ? "preview" : "file",
       s:Object.assign({}, t.s), at:Date.now(), art:t.art || "", fullDur:t.fullDur || 0, dur:t.buffer ? t.buffer.duration : 0};
  t.histId = e.id; hist.unshift(e);
  dbOp("hist", "readwrite", st => st.put({id:e.id, file:t.file})).catch(() => {});
  while (hist.length > HIST_MAX){ const old = hist.pop(); dbOp("hist", "readwrite", st => st.delete(old.id)).catch(() => {}); }
  histSave();
}
let histT = 0;
function histUpdateS(t){ if (!t || !t.histId) return; clearTimeout(histT);
  histT = setTimeout(() => { const e = hist.find(x => x.id === t.histId); if (e){ e.s = Object.assign({}, t.s); histSave(); } }, 400); }
async function histOpen(id){
  const e = hist.find(x => x.id === id); if (!e) return;
  const inQueue = tracks.find(t => t.histId === id);
  show("studio"); $("#sres").hidden = true;
  if (inQueue){ select(inQueue); return; }
  try {
    const rec = await dbOp("hist", "readonly", st => st.get(id)); if (!rec || !rec.file) throw new Error();
    await addFiles([new File([rec.file], e.name, {type:rec.file.type || "audio/mpeg"})], e.s, {preview:e.kind === "preview", fullDur:e.fullDur, art:e.art, histId:e.id});
  } catch { toast("This song is no longer saved. Open the file again.", 3000); hist = hist.filter(x => x.id !== id); histSave(); }
}
function histRemove(id){ hist = hist.filter(x => x.id !== id); histSave(); dbOp("hist", "readwrite", st => st.delete(id)).catch(() => {}); }
const ago = ts => { const s = (Date.now() - ts)/1000; if (s < 60) return "just now"; if (s < 3600) return Math.floor(s/60) + " min ago"; if (s < 86400) return Math.floor(s/3600) + " h ago"; const d = Math.floor(s/86400); return d === 1 ? "yesterday" : d + " days ago"; };
function histRow(e, compact){
  const nm = e.name.replace(/\.[^.]+$/, "").replace(/ \(preview\)$/, "");
  return `<div class="hrow" data-hist="${e.id}">
    <div class="hart">${e.art ? `<img src="${esc(e.art)}" alt="" loading="lazy">` : `<span class="disc"></span>`}</div>
    <div class="hmain"><div class="hn">${esc(nm)}</div><div class="hd"><span class="hk ${e.kind}">${e.kind === "preview" ? "30 s preview" : "File"}</span>${esc(summary(Object.assign(DEF(), e.s)))} · ${ago(e.at)}</div></div>
    ${compact ? "" : `<button class="btn hot" data-hopen="${e.id}">Open</button><button class="icon-btn" data-hdel="${e.id}" aria-label="Remove from history" title="Remove"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`}
  </div>`;
}

const APP_VERSION = CHANGELOG[0].v;
const vnum = v => v.split(".").map(Number).reduce((a, x) => a*1000 + x, 0);
function newsSeen(){ try { return localStorage.getItem("sw2-seen-version"); } catch { return null; } }
function newsMarkSeen(){ try { localStorage.setItem("sw2-seen-version", APP_VERSION); } catch {} const d = document.querySelector(".news-dot"); if (d) d.hidden = true; }
function openNews(sinceV){
  closeNews();
  const fresh = sinceV ? CHANGELOG.filter(c => vnum(c.v) > vnum(sinceV)) : [];
  const list = fresh.length ? fresh : CHANGELOG;
  const fmtD = d => new Date(d + "T12:00:00").toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"});
  const wrap = document.createElement("div");
  wrap.className = "news-wrap"; wrap.id = "newsWrap";
  wrap.innerHTML = `<div class="news" role="dialog" aria-modal="true" aria-labelledby="newsT">
    <div class="news-top"><div><div class="news-eye">${fresh.length ? "Updated to version " + APP_VERSION : "Version " + APP_VERSION}</div><h2 id="newsT">What's new</h2></div>
      <button class="icon-btn" id="newsX" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

    <div class="news-foot"><button class="btn hot" id="newsOk">Got it</button></div></div>`;
  document.body.appendChild(wrap);

  const all = wrap.querySelector("#newsAll"); if (all) all.onclick = () => { newsMarkSeen(); openNews(null); };

/* ================= design switching ================= */
function setSkin(v, fromEl){
  if (v === prefs.skin) return;
  const apply = () => {
    prefs.skin = v; prefs.player = v === "moon" ? "cassette" : "vinyl"; savePrefs();
    if (v === "moon") document.documentElement.setAttribute("data-skin", "moon"); else document.documentElement.removeAttribute("data-skin");
    document.querySelector('meta[name="theme-color"]').content = v === "moon" ? "#000000" : "#0c0915";
    refreshTok(); renderStage(); renderList(); moveTabInd();
  };
  if (fromEl){ const r = fromEl.getBoundingClientRect();
    document.documentElement.style.setProperty("--sx", (r.left + r.width/2)/innerWidth*100 + "%");
    document.documentElement.style.setProperty("--sy", (r.top + r.height/2)/innerHeight*100 + "%"); }
